<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<!--
  Video 03 · "3 errores al armar tu PC" (19,8 s · 130 BPM)
  Escenas: A gancho → E1 memoria → E2 fuente → E3 disipador → W golpes → F cierre
  Los datos técnicos salen de lib/catalogo.js (REGLAS) y components/Armador.jsx (consumo):
    · Ryzen 5 7600X → AM5 → DDR5
    · RTX 5070 → fuente ≥ 650 W; 7600X (105 W) + 5070 (250 W) + 90 W = 445 W → recomendada 650 W
    · Ryzen 7 9800X3D → sin disipador
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;background:#000;overflow:hidden}
  body{font-family:'Inter Display','Inter',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
  .capa{position:absolute;inset:0;display:none;overflow:hidden}
  .mono{font-family:'DejaVu Sans Mono',monospace;letter-spacing:.1em}
  .l{position:absolute;left:0;right:0;text-align:center;font-weight:900;letter-spacing:-.025em;line-height:.92;white-space:nowrap;text-transform:uppercase}
  canvas{position:absolute;left:0;top:0}
  /* errores */
  #cab{position:absolute;left:100px;right:100px;top:240px;display:flex;justify-content:space-between;align-items:center;font-size:30px;color:#cfcfcf}
  #barras{display:flex;gap:10px}
  #barras i{display:block;width:70px;height:6px;background:#333}
  .tit{position:absolute;left:96px;font-weight:900;letter-spacing:-.035em;line-height:.9;white-space:nowrap;text-transform:uppercase}
  .pieza{position:absolute;left:190px;width:800px}
  .pieza .k{font-size:30px;color:#8a8a8a}
  .pieza .n{font-size:104px;font-weight:800;letter-spacing:-.03em;line-height:1.02;margin-top:6px;white-space:nowrap;text-decoration-thickness:6px}
  .pieza .e{display:flex;align-items:center;gap:16px;font-size:38px;margin-top:10px;color:#d8d8d8}
  .pieza .e svg{width:40px;height:40px;flex:none}
  #medidor{position:absolute;left:120px;width:840px;top:1390px;display:none}
  #sol{position:absolute;left:100px;right:100px;top:1530px;font-size:34px;line-height:1.4;color:#fff}
  .grande{position:absolute;left:60px;right:60px;top:50%;text-align:center;font-weight:900;letter-spacing:-.025em;line-height:.95;text-transform:uppercase}
  .tag{position:absolute;left:0;right:0;text-align:center;font-weight:200;letter-spacing:-.05em;line-height:.95}
  .pill{display:inline-block;border:2px solid #fff;border-radius:999px;padding:22px 44px;font-size:40px;font-weight:500}
  #logo{position:absolute;left:390px;width:300px}
  #flash{position:absolute;inset:0;background:#fff;pointer-events:none;opacity:0}
</style></head>
<body>
<div class="capa" id="A"></div>
<div class="capa" id="E">
  <canvas id="linea" width="1080" height="1920"></canvas>
  <div id="cab" class="mono"><span id="num"></span><span id="barras"><i></i><i></i><i></i></span></div>
  <p class="tit" id="t1"></p><p class="tit" id="t2"></p>
  <canvas id="medidor" width="840" height="150"></canvas>
  <p id="sol" class="mono"></p>
</div>
<div class="capa" id="W"><p class="grande" id="Wt"></p></div>
<div class="capa" id="F">
  <img id="logo" src="logo.svg" alt="">
  <div class="tag" id="tag"></div>
  <div id="pie" style="position:absolute;left:0;right:0;text-align:center"></div>
</div>
<div id="flash"></div>
<script>
const AZUL = '#2E8CFF';
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 4);
const easeIO = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const prog = (t, a, b) => clamp((t - a) / (b - a));
function rnd(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const med = document.createElement('canvas').getContext('2d');
const ancho = (txt, px, peso = 900) => { med.font = `${peso} ${px}px "Inter Display"`; return med.measureText(txt.toUpperCase()).width * 0.97; };
const cabe = (txt, max, base, peso) => Math.min(base, base * max / ancho(txt, base, peso));
const OK = `<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="none" stroke="${AZUL}" stroke-width="2.4"/><path d="M10 17.5l5 5 9-11" fill="none" stroke="${AZUL}" stroke-width="2.8"/></svg>`;
const NO = `<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M11 11l12 12M23 11L11 23" stroke="#fff" stroke-width="2.8"/></svg>`;

/* ====================== tiempos (130 BPM: un golpe cada 0,46 s) ====================== */
const BEAT = 0.46;
const T = { A: 0, E1: 3.22, E2: 6.9, E3: 10.58, W: 14.26, F: 16.1, FIN: 19.8 };
// escenas para render.cjs (se renderizan por partes)
window.ESC = [[T.A, T.E1], [T.E1, T.E2], [T.E2, T.E3], [T.E3, T.W], [T.W, T.F], [T.F, T.FIN]];
// momentos de sonido (los usa sonido.py vía render.cjs → golpes.json)
const CORTES = [];

/* ====================== A: gancho ====================== */
const GANCHO = [
  [0.15, '#000', '#fff', ['3 errores']],
  [0.15 + 2 * BEAT, '#000', '#fff', ['al armar', 'tu PC']],
  [0.15 + 4 * BEAT, '#fff', '#000', ['que salen', 'caros.']],
];
GANCHO.forEach((g) => CORTES.push(['golpe', g[0]]));
const nA = GANCHO.map(() => { const p = document.createElement('p'); p.className = 'l'; $('A').appendChild(p); return p; });
function escenaA(t) {
  let i = -1; GANCHO.forEach((g, j) => { if (t >= g[0]) i = j; });
  const A = $('A');
  A.style.background = i >= 0 ? GANCHO[i][1] : '#000';
  nA.forEach((el, j) => {
    el.style.display = j === i ? 'block' : 'none';
    if (j !== i) return;
    const [t0, , color, lineas] = GANCHO[j];
    const k = ease((t - t0) / 0.24);
    const px = j === 0 ? cabe('3 errores', 960, 260, 900) : Math.min(...lineas.map((l) => cabe(l, 940, 210, 900)));
    el.innerHTML = lineas.join('<br>');
    el.style.color = color; el.style.fontSize = px + 'px';
    el.style.top = (960 - px * 0.92 * lineas.length / 2) + 'px';
    el.style.filter = `blur(${(1 - k) * 16}px)`; el.style.transform = `scale(${1.15 - .15 * k})`; el.style.opacity = k;
  });
  // el "3" tiembla en el primer golpe
  // falla de pantalla al salir
  const g = prog(t, T.E1 - 0.4, T.E1);
  if (g > 0) {
    const r = rnd(Math.floor(t * 30) + 11);
    A.style.transform = `translateX(${(r() - .5) * 110 * g}px)`;
    A.style.filter = `drop-shadow(${12 * g}px 0 0 ${AZUL})`;
    A.style.clipPath = r() < g ? `inset(${r() * 40}% 0 ${r() * 40}% 0)` : 'none';
  } else { A.style.transform = 'none'; A.style.filter = 'none'; A.style.clipPath = 'none'; }
}

/* ====================== E: los tres errores ====================== */
const ERRORES = [
  {
    t0: T.E1, titulo: ['Memoria', 'que no entra.'],
    base: ['Procesador', 'Ryzen 5 7600X', 'Socket AM5 · usa DDR5'],
    mal: ['Memoria', 'DDR4 3200', 'AM5 solo acepta DDR5'],
    bien: ['Memoria', 'DDR5 6000', 'Compatible con la board AM5'],
    sol: 'Cada board de la tienda dice si es DDR4 o DDR5.',
  },
  {
    t0: T.E2, titulo: ['Fuente que se', 'queda corta.'],
    base: ['Tarjeta de video', 'RTX 5070', 'Con un Ryzen 5 7600X: ≈ 445 W'],
    mal: ['Fuente', '500 W', 'Recomendada: 650 W o más'],
    bien: ['Fuente', '650 W 80 Plus', 'Cumple lo recomendado'],
    sol: 'Cada tarjeta de video dice qué fuente necesita.',
    medidor: { max: 800, consumo: 445, recomendada: 650, mal: 500, bien: 650 },
  },
  {
    t0: T.E3, titulo: ['Procesador', 'sin disipador.'],
    base: ['Procesador', 'Ryzen 7 9800X3D', 'No trae disipador en la caja'],
    mal: ['Refrigeración', 'Ninguna', 'Sin disipador no puede funcionar'],
    bien: ['Refrigeración', 'Disipador aparte', 'Aire o líquida'],
    sol: 'Cada procesador dice si trae disipador.',
  },
];
// tiempos internos de cada error (en golpes desde el inicio)
const P = { t2: 1, base: 2, mal: 3, bien: 5, sol: 5.5 };
ERRORES.forEach((e) => { CORTES.push(['corte', e.t0]); CORTES.push(['golpe', e.t0 + P.t2 * BEAT]); CORTES.push(['golpe', e.t0 + P.base * BEAT]); CORTES.push(['falla', e.t0 + P.mal * BEAT]); CORTES.push(['bien', e.t0 + P.bien * BEAT]); });

const Y0 = 880, PASO = 300, XL = 120;
const filas = [0, 1].map((i) => {
  const d = document.createElement('div'); d.className = 'pieza';
  d.innerHTML = '<p class="k mono"></p><p class="n"></p><p class="e"></p>';
  d.style.top = (Y0 + i * PASO - 18) + 'px';
  $('E').appendChild(d); return d;
});
function llenar(el, i, [k, n, e], icono) {
  const q = (s) => el.querySelector(s);
  const kk = `${String(i + 1).padStart(2, '0')} · ${k.toUpperCase()}`;
  if (q('.k').textContent !== kk) q('.k').textContent = kk;
  if (q('.n').textContent !== n) q('.n').textContent = n;
  const html = `${icono}<span>${e}</span>`;
  if (q('.e').dataset.h !== html) { q('.e').innerHTML = html; q('.e').dataset.h = html; }
}
function escenaE(t) {
  let idx = 0; ERRORES.forEach((e, j) => { if (t >= e.t0) idx = j; });
  const E = ERRORES[idx], lt = t - E.t0, b = (x) => E.t0 + x * BEAT;

  // cabecera: número y barras de avance
  $('num').textContent = `ERROR ${String(idx + 1).padStart(2, '0')} / 03`;
  [...$('barras').children].forEach((el, j) => {
    const lleno = j < idx ? 1 : j === idx ? ease(lt / 0.4) : 0;
    el.style.background = `linear-gradient(90deg, ${AZUL} ${lleno * 100}%, #333 ${lleno * 100}%)`;
  });
  $('cab').style.opacity = ease(lt / 0.2);

  // título en dos golpes
  const tit = [$('t1'), $('t2')];
  const px = Math.min(...E.titulo.map((l) => cabe(l, 890, 175, 900)));
  tit.forEach((el, j) => {
    const t0 = j ? b(P.t2) : E.t0, k = ease((t - t0) / 0.24);
    el.textContent = E.titulo[j]; el.style.fontSize = px + 'px';
    el.style.top = (330 + j * px * 0.92) + 'px';
    el.style.opacity = t >= t0 ? k : 0;
    el.style.filter = `blur(${(1 - k) * 14}px)`; el.style.transform = `translateX(${(1 - k) * 50}px)`;
    el.style.color = j === 1 && t >= b(P.mal) && t < b(P.bien) ? AZUL : '#fff';
  });

  // filas: pieza base y la pieza que falla / se corrige
  const malo = t >= b(P.mal) && t < b(P.bien), corregido = t >= b(P.bien);
  llenar(filas[0], 0, E.base, OK);
  llenar(filas[1], 1, corregido ? E.bien : E.mal, corregido ? OK : NO);
  const k0 = ease((t - b(P.base)) / 0.3);
  filas[0].style.opacity = t >= b(P.base) ? k0 : 0;
  filas[0].style.transform = `translateX(${(1 - k0) * 60}px)`; filas[0].style.filter = `blur(${(1 - k0) * 12}px)`;
  const f1 = filas[1], n1 = f1.querySelector('.n');
  if (t < b(P.mal)) { f1.style.opacity = 0; }
  else if (malo) {
    const k = ease((t - b(P.mal)) / 0.25), r = rnd(Math.floor(t * 30) + idx * 7);
    const g = 1 - prog(t, b(P.mal), b(P.mal) + 0.45);
    f1.style.opacity = k;
    f1.style.transform = `translateX(${(r() - .5) * 60 * g + (1 - k) * 60}px)`;
    f1.style.filter = g > .15 ? `drop-shadow(8px 0 0 ${AZUL})` : 'none';
    f1.style.clipPath = g > .3 && r() < g ? `inset(${r() * 40}% 0 ${r() * 30}% 0)` : 'none';
    n1.style.textDecoration = t > b(P.mal) + 0.5 ? 'line-through' : 'none';
  } else {
    const k = ease((t - b(P.bien)) / 0.3);
    f1.style.opacity = 1; f1.style.clipPath = 'none'; n1.style.textDecoration = 'none';
    f1.style.filter = `blur(${(1 - k) * 10}px)`; f1.style.transform = `scale(${1.04 - .04 * k})`; f1.style.transformOrigin = '0 50%';
  }

  // línea de circuito con nodos (como en 02)
  const cx = $('linea').getContext('2d');
  cx.clearRect(0, 0, 1080, 1920);
  const nodos = [b(P.base), b(P.mal)];
  const llega = t >= b(P.mal) ? 1 : t >= b(P.base) ? 0 : -1;
  if (llega >= 0) {
    const yFin = Y0 + llega * PASO + 30;
    cx.strokeStyle = 'rgba(255,255,255,.18)'; cx.lineWidth = 3;
    cx.beginPath(); cx.moveTo(XL, Y0 - 60); cx.lineTo(XL, yFin); cx.stroke();
    // pulso que baja
    const tp = nodos[llega], kp = easeIO((t - tp) / 0.35);
    const yIni = llega ? Y0 + 30 : Y0 - 60, yP = yIni + (yFin - yIni) * kp;
    const color = malo && llega === 1 ? '#fff' : AZUL;
    cx.save(); cx.shadowColor = color; cx.shadowBlur = 24; cx.strokeStyle = color; cx.lineWidth = 5;
    cx.beginPath(); cx.moveTo(XL, Math.max(Y0 - 60, yP - 150)); cx.lineTo(XL, yP); cx.stroke(); cx.restore();
    // corriente continua cuando ya está corregido
    if (corregido) {
      const s = ((t - b(P.bien)) * 1.6) % 1, y = Y0 - 60 + (PASO + 90) * s;
      cx.save(); cx.shadowColor = AZUL; cx.shadowBlur = 18; cx.strokeStyle = AZUL; cx.lineWidth = 4;
      cx.beginPath(); cx.moveTo(XL, Math.max(Y0 - 60, y - 90)); cx.lineTo(XL, y); cx.stroke(); cx.restore();
    }
    nodos.forEach((tn, j) => {
      if (t < tn) return;
      const k = ease((t - tn) / 0.3), y = Y0 + j * PASO + 30, mal = j === 1 && malo;
      cx.save(); cx.shadowColor = mal ? '#fff' : AZUL; cx.shadowBlur = 18 * k;
      cx.fillStyle = '#000'; cx.strokeStyle = mal ? '#fff' : AZUL; cx.lineWidth = 4;
      cx.beginPath(); cx.arc(XL, y, 14, 0, 7); cx.fill(); cx.stroke();
      cx.beginPath(); cx.moveTo(XL + 14, y); cx.lineTo(XL + 50, y); cx.stroke(); cx.restore();
    });
  }

  // medidor de potencia (solo en el error de la fuente)
  const mc = $('medidor');
  mc.style.display = E.medidor ? 'block' : 'none';
  if (E.medidor) {
    const M = E.medidor, x = mc.getContext('2d'), W = 840, H = 150, yb = 70, hb = 26, X = (w) => (w / M.max) * W;
    x.clearRect(0, 0, W, H);
    const kIn = ease((t - b(P.mal)) / 0.3);
    mc.style.opacity = t >= b(P.mal) ? kIn : 0;
    // carril
    x.fillStyle = '#1c1c1c'; x.fillRect(0, yb, W, hb);
    // relleno: 500 W blanco → 650 W azul
    const lleno = corregido ? M.mal + (M.bien - M.mal) * easeIO((t - b(P.bien)) / 0.4) : M.mal * easeIO((t - b(P.mal)) / 0.45);
    x.fillStyle = corregido ? AZUL : '#fff';
    if (corregido) { x.save(); x.shadowColor = AZUL; x.shadowBlur = 20; }
    x.fillRect(0, yb, X(lleno), hb);
    if (corregido) x.restore();
    // marcas: consumo y recomendada
    x.font = '24px "DejaVu Sans Mono"'; x.textBaseline = 'alphabetic';
    [[M.consumo, `CONSUMO ${M.consumo} W`, '#8a8a8a', 'left'], [M.recomendada, `RECOMENDADA ${M.recomendada} W`, '#fff', 'right']].forEach(([w, txt, c, al]) => {
      x.strokeStyle = c; x.lineWidth = 3; x.beginPath(); x.moveTo(X(w), yb - 16); x.lineTo(X(w), yb + hb + 8); x.stroke();
      x.fillStyle = c; x.textAlign = 'right';
      x.fillText(txt, al === 'right' ? W : X(w) + 2, yb - 26);
    });
    // valor de la fuente
    x.textAlign = 'left'; x.fillStyle = corregido ? AZUL : '#fff'; x.font = '26px "DejaVu Sans Mono"';
    x.fillText(`TU FUENTE: ${Math.round(lleno / 10) * 10} W`, 0, yb + hb + 46);
    if (malo && t > b(P.mal) + 0.5) { x.textAlign = 'right'; x.fillStyle = '#fff'; x.fillText(`FALTAN ${M.recomendada - M.mal} W`, W, yb + hb + 46); }
  }

  // solución
  const sol = $('sol'), ks = ease((t - b(P.sol)) / 0.35);
  const txt = E.sol.toUpperCase();
  if (sol.textContent !== txt) sol.textContent = txt;
  sol.style.color = AZUL; sol.style.opacity = t >= b(P.sol) ? ks : 0;
  sol.style.transform = `translateY(${(1 - ks) * 20}px)`;
  sol.style.top = (E.medidor ? 1585 : 1520) + 'px';
}

/* ====================== W: golpes ====================== */
const GOLPES = [
  [T.W, '#000', '#fff', 'Memoria.'],
  [T.W + 1 * BEAT, '#000', '#fff', 'Potencia.'],
  [T.W + 2 * BEAT, '#000', '#fff', 'Disipador.'],
  [T.W + 3 * BEAT, AZUL, '#fff', 'Revisado.'],
];
GOLPES.forEach((g) => CORTES.push(['golpe', g[0]]));
function escenaW(t) {
  let c = GOLPES[0]; for (const g of GOLPES) if (t >= g[0]) c = g;
  const [t0, fondo, color, txt] = c, el = $('Wt');
  $('W').style.background = fondo; el.style.color = color; el.innerHTML = txt;
  el.style.fontSize = cabe(txt, 940, 250, 900) + 'px';
  const k = ease((t - t0) / 0.22);
  el.style.transform = `translateY(-50%) scale(${1.12 - .12 * k})`; el.style.filter = `blur(${(1 - k) * 10}px)`;
}

/* ====================== F: cierre con el lobo ====================== */
CORTES.push(['boom', T.F]);
function escenaF(t) {
  const lt = t - T.F;
  const lg = $('logo');
  // el lobo se enciende de abajo hacia arriba
  const k = easeIO(lt / 0.9), brillo = 1 + 0.15 * Math.sin(lt * 3) * prog(lt, 1, 1.5);
  lg.style.top = (400 - 20 * ease(lt / 0.8)) + 'px';
  lg.style.clipPath = `inset(${(1 - k) * 100}% 0 0 0)`;
  lg.style.filter = `drop-shadow(0 0 ${14 * brillo}px rgba(46,140,255,.85)) drop-shadow(0 0 ${40 * brillo}px rgba(46,140,255,.5))`;
  const tag = $('tag');
  if (!tag.dataset.ok) { tag.innerHTML = '<div>Arma bien</div><div>a la primera.</div>'; tag.dataset.ok = 1; }
  tag.style.top = '780px'; tag.style.fontSize = '140px';
  [...tag.children].forEach((d, i) => { const q = ease(prog(lt, 0.35 + i * .15, 0.95 + i * .15)); d.style.opacity = q; d.style.filter = `blur(${(1 - q) * 14}px)`; d.style.transform = `translateY(${(1 - q) * 30}px)`; });
  const pie = $('pie');
  if (!pie.dataset.ok) {
    pie.innerHTML = `<p style="font-size:36px;color:#bdbdbd">El armador de la página revisa memoria,<br>fuente y disipador por ti.</p>
      <div style="margin-top:50px"><span class="pill">wolftech.com.co</span></div>
      <p class="mono" style="font-size:31px;color:#cfcfcf;margin-top:40px">COTIZA POR WHATSAPP · ENVÍOS A TODA COLOMBIA</p>`;
    pie.dataset.ok = 1;
  }
  pie.style.top = '1120px';
  [...pie.children].forEach((d, i) => { const q = ease(prog(lt, 0.9 + i * .15, 1.5 + i * .15)); d.style.opacity = q; d.style.transform = `translateY(${(1 - q) * 30}px)`; });
  document.body.style.opacity = 1 - prog(t, T.FIN - 0.35, T.FIN);
}

/* ====================== director ====================== */
function render(t) {
  const m = (id, on) => { $(id).style.display = on ? 'block' : 'none'; };
  m('A', t < T.E1); m('E', t >= T.E1 && t < T.W); m('W', t >= T.W && t < T.F); m('F', t >= T.F);
  if (t < T.E1) escenaA(t); else if (t < T.W) escenaE(t); else if (t < T.F) escenaW(t); else escenaF(t);
  // destello blanco de 3 cuadros en cada cambio de error y en el cierre
  const fl = [T.E1, T.E2, T.E3, T.F].reduce((a, c) => Math.max(a, 1 - prog(t, c, c + 0.1) - (t < c ? 1 : 0)), 0);
  $('flash').style.opacity = fl * 0.85;
}
window.listo = document.fonts.ready;
window.render = render;
window.CORTES = CORTES.sort((a, b) => a[1] - b[1]);
window.T = T;
</script>
</body></html>
